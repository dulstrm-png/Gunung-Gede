name: DULZ GUNUNG GEDE - BUILD APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-android:

    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y fontconfig libfontconfig1
          apt-get clean

      - name: Check Android Environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          sdkmanager --version
          adb version
          godot --version

      - name: Find Game ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP GAME TIDAK DITEMUKAN!"
            exit 1
          fi

          echo "ZIP GAME:"
          echo "$ZIP"

          echo "GAME_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Game ZIP
        run: |
          rm -rf game
          mkdir -p game

          unzip -o "$GAME_ZIP" -d game

      - name: Find Godot Project
        run: |
          PROJECT=$(find game -name "project.godot" -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot tidak ditemukan!"

            echo "Isi ZIP:"
            find game -maxdepth 4 -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot Project:"
          echo "$PROJECT_DIR"

      - name: Install Godot Android Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates

          godot \
            --headless \
            --editor \
            --quit \
            --install-android-build-template

      - name: Verify Android Template
        run: |
          echo "Export Templates:"
          find ~/.local/share/godot/export_templates -maxdepth 3 -type f | head -50

      - name: Import Game
        run: |
          godot \
            --headless \
            --editor \
            --quit \
            --path "$PROJECT_DIR"

      - name: Build Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/Dulz-Gunung-Gede.apk"

      - name: Check APK
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/build/Dulz-Gunung-Gede.apk" ]; then
            echo "ERROR: APK tidak berhasil dibuat!"
            exit 1
          fi

          echo "APK BERHASIL DIBUAT!"
          ls -lh "$GITHUB_WORKSPACE/build/Dulz-Gunung-Gede.apk"

          du -h "$GITHUB_WORKSPACE/build/Dulz-Gunung-Gede.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DULZ-GUNUNG-GEDE-APK
          path: build/Dulz-Gunung-Gede.apk
          if-no-files-found: error
